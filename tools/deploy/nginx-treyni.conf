# 托蕾妮小程序后端反代
# 把 api.example.com 换成你自己的域名，然后 certbot --nginx -d 你的域名 会自动补 443 段
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # 上传植物照片用；小程序端单张一般 < 5MB，留足余量
    client_max_body_size 20m;

    access_log /var/log/nginx/treyni.access.log;
    error_log  /var/log/nginx/treyni.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成最长约 60 秒，超时要留够，否则接口会被 nginx 掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }
}
